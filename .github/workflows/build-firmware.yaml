name: build-firmware

# Build panda firmware (F4 dos + H7) and commit the signed binaries back into
# board/obj (gitignored dir, force-added) so every tree that tracks this repo
# ships flash-ready firmware: the main openpilot repo packages submodule
# contents verbatim, and pandad's brick guard needs these files to flash
# pandas stuck in bootstub (e.g. F4 dos units flashed with H7 firmware by
# other forks). After firmware lands here, bump the submodule pointer in the
# main repo (sync-panda-firmware workflow).

on:
  push:
    branches: [master]
    paths:
      - 'board/**'
      - '.github/workflows/build-firmware.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout opendbc (can.h for firmware hashing)
        uses: actions/checkout@v4
        with:
          repository: mouxangithub/opendbc
          path: opendbc

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-gcc --version | head -1

      - name: Install python deps
        run: |
          python3 -m pip install --break-system-packages --upgrade pip scons

      - name: Build debug firmware (F4 + H7)
        run: |
          # opendbc as a sibling checkout for INCLUDE_PATH and can.h hashing
          PYTHONPATH=$GITHUB_WORKSPACE/opendbc scons -j$(nproc)
          ls -la board/obj/

      - name: Build release-type firmware (debug cert, RELEASE flag)
        run: |
          rm -f board/obj/panda.bin.signed board/obj/panda_h7.bin.signed
          PYTHONPATH=$GITHUB_WORKSPACE/opendbc CERT=board/crypto/certs/debug RELEASE=1 scons -j$(nproc)
          ls -la board/obj/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panda-firmware
          path: |
            board/obj/panda.bin.signed
            board/obj/panda_h7.bin.signed
            board/obj/bootstub.panda.bin
            board/obj/bootstub.panda_h7.bin
          if-no-files-found: error

      - name: Commit firmware into board/obj
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f board/obj/panda.bin.signed board/obj/panda_h7.bin.signed \
                    board/obj/bootstub.panda.bin board/obj/bootstub.panda_h7.bin
          if git diff --cached --quiet; then
            echo "firmware unchanged, nothing to commit"
          else
            git commit -m "board: update prebuilt firmware from CI [skip ci]"
            git push origin HEAD:master
          fi
