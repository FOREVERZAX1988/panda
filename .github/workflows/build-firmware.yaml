name: build-firmware

# Build panda firmware (F4 dos + H7) as a compile check and upload the signed
# binaries as workflow artifacts (manual rescue firmware download). The binaries
# are NOT committed back into board/obj anymore: on-device firmware is built by
# the main repo's scons build (SConstruct includes panda/SConscript), carried
# across updates by the updater, and the main repo's staged tree strips them
# (gitignore-covered). A tracked copy can never stay byte-identical to that
# rebuild and dirtied every staging sync with four conflicts.

on:
  push:
    branches: [master]
    paths:
      - 'board/**'
      - 'SConscript'
      - '.github/workflows/build-firmware.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout opendbc (can.h for firmware hashing)
        uses: actions/checkout@v4
        with:
          repository: mouxangithub/opendbc
          path: opendbc

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-gcc --version | head -1

      - name: Install python deps
        run: |
          python3 -m pip install --break-system-packages --upgrade pip scons

      - name: Build debug firmware (F4 + H7)
        run: |
          # opendbc as a sibling checkout for INCLUDE_PATH and can.h hashing
          PYTHONPATH=$GITHUB_WORKSPACE/opendbc scons -j$(nproc)
          ls -la board/obj/

      - name: Build release-type firmware (debug cert, RELEASE flag)
        run: |
          rm -f board/obj/panda.bin.signed board/obj/panda_h7.bin.signed
          PYTHONPATH=$GITHUB_WORKSPACE/opendbc CERT=board/crypto/certs/debug RELEASE=1 scons -j$(nproc)
          ls -la board/obj/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panda-firmware
          path: |
            board/obj/panda.bin.signed
            board/obj/panda_h7.bin.signed
            board/obj/bootstub.panda.bin
            board/obj/bootstub.panda_h7.bin
          if-no-files-found: error
